:root{color-scheme:dark;
  --bg:#0b0c0c; --ink:#f3f5f4; --muted:#8d9591; --line:rgba(255,255,255,.12);
  --green:#2EE05C; --green-ink:#08130b; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.top{position:fixed;top:0;left:0;padding:max(28px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-left)) 0;z-index:5;pointer-events:none}
.logo{display:block;width:132px;height:auto;color:var(--green)}

.layer{position:fixed;z-index:4;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:16px;
  background:var(--green);color:var(--green-ink);transition:transform .2s var(--ease),filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);
  font-size:15px;font-weight:500;transition:border-color .2s,background .2s}
.ghost:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}
.icon{width:44px;padding:0}

.hero{left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px max(48px,env(safe-area-inset-bottom))}
body[data-mode=hero] .hero{opacity:1;pointer-events:auto}

.openbar{left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px max(28px,env(safe-area-inset-bottom))}
body[data-mode=open] .openbar{opacity:1;pointer-events:auto}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:900px}
#chips button{height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s,background .2s}
#chips button:hover,#chips button.hover{color:var(--ink);background:rgba(255,255,255,.06)}
#btn-pack{font-size:14px;height:40px}

#panel{right:0;top:0;bottom:0;width:min(420px,34vw);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 max(48px,env(safe-area-inset-right)) 0 0}
body[data-mode=inspect] #panel{opacity:1;pointer-events:auto}
#p-name{font-size:clamp(30px,2.8vw,42px);line-height:1.05;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}
#p-tag{font-size:18px;line-height:1.4;color:var(--green);margin:12px 0 0;text-wrap:balance}
#p-note{display:inline-block;margin:14px 0 0;padding:6px 12px;border-radius:999px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
#p-photo{display:flex;align-items:center;gap:14px;padding:8px 18px 8px 8px;border-radius:16px;border:1px solid var(--line);align-self:flex-start;transition:border-color .2s,background .2s}
#p-photo:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}
#p-photo img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#16181a}
#p-photo span{font-size:14px;font-weight:500}
#lightbox{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 16px;background:rgba(6,7,7,.92);opacity:0;transition:opacity .25s;cursor:zoom-out}
#lightbox.show{opacity:1}
#lightbox img{max-width:min(560px,92vw);max-height:86vh;object-fit:contain}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts:not(:has(button:not([hidden]))){display:none}
.acts .ghost{border-color:rgba(46,224,92,.45);color:var(--green)}
.navrow{display:flex;align-items:center;gap:8px}
.navrow .btn{flex:1;height:48px;font-size:15px}

#loader{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .9s var(--ease) .2s,visibility 0s 1.2s}
#loader .logo{width:180px}
#loadbar{width:180px;height:2px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:2px}
#loadbar i{display:block;height:100%;background:var(--green);transform-origin:left;transform:scaleX(0);transition:transform .3s}
body.loaded #loader{opacity:0;visibility:hidden}

@media (max-width:900px){
  .top{padding:max(18px,env(safe-area-inset-top)) 18px 0}
  .logo{width:112px}
  #chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  #chips::-webkit-scrollbar{display:none}
  #chips button{flex:none}
  #panel{top:auto;left:0;width:auto;justify-content:flex-end;gap:16px;padding:48px 16px max(18px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(11,12,12,0),rgba(11,12,12,.9) 40%)}
  #p-name{font-size:28px}
  #p-tag{font-size:16px;margin-top:6px}
  #p-note{margin-top:10px;font-size:12px}
  #p-photo img{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
